version: 2

models:
  - name: sensor_events_analytics
    description: "Analytics-ready AtmoSync sensor events"

    columns:
      - name: EVENT_ID
        description: "Unique sensor event identifier"
        data_tests:
          - unique
          - not_null

      - name: EVENT_TS
        data_tests:
          - not_null

      - name: TEMPERATURE_STATUS
        data_tests:
          - accepted_values:
              arguments:
                values: ['HIGH', 'LOW', 'NORMAL']

      - name: HUMIDITY_STATUS
        data_tests:
          - accepted_values:
              arguments:
                values: ['HIGH', 'LOW', 'NORMAL']

      - name: VIBRATION_STATUS
        data_tests:
          - accepted_values:
              arguments:
                values: ['HIGH', 'NORMAL']

      - name: OVERALL_STATUS
        data_tests:
          - accepted_values:
              arguments:
                values: ['ALERT', 'NORMAL']
      - name: RISK_SCORE
        description: "Numeric risk score based on temperature, humidity, and vibration conditions"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]

      - name: RISK_LEVEL
        description: "Overall risk classification derived from the sensor risk score"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LOW', 'MEDIUM', 'HIGH']