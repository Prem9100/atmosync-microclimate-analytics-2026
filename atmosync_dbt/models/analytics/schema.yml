version: 2

models:
  - name: sensor_events_analytics
    description: "Analytics-ready AtmoSync sensor events"

    columns:
      - name: EVENT_ID
        description: "Unique sensor event identifier"
        data_tests:
          - unique
          - not_null

      - name: EVENT_TS
        data_tests:
          - not_null

      - name: TEMPERATURE_STATUS
        data_tests:
          - accepted_values:
              arguments:
                values: ['HIGH', 'LOW', 'NORMAL']

      - name: HUMIDITY_STATUS
        data_tests:
          - accepted_values:
              arguments:
                values: ['HIGH', 'LOW', 'NORMAL']

      - name: VIBRATION_STATUS
        data_tests:
          - accepted_values:
              arguments:
                values: ['HIGH', 'NORMAL']

      - name: OVERALL_STATUS
        data_tests:
          - accepted_values:
              arguments:
                values: ['ALERT', 'NORMAL']